<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; media-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Soundboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-view="sounds">
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>
        </div>
        <h1>Soundboard</h1>
      </div>

      <section class="side-section profiles-section">
        <div class="side-head">
          <span data-i18n="sidebar.profiles"></span>
          <button id="addProfile" class="side-add" data-i18n-title="sidebar.addProfile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div id="tabs" class="tabs"></div>
      </section>

      <nav class="side-foot">
        <div id="sideUpdate" class="side-update" hidden>
          <div class="side-update-text">
            <strong id="sideUpdTitle"></strong>
            <span id="sideUpdText"></span>
          </div>
          <button id="sideUpdAction" class="btn small primary"></button>
        </div>
        <div class="theme side-theme" role="group" data-i18n-aria="theme.label">
          <button data-theme="system" data-i18n-title="theme.system.title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            <span data-i18n="theme.system"></span>
          </button>
          <button data-theme="light" data-i18n-title="theme.light.title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span data-i18n="theme.light"></span>
          </button>
          <button data-theme="dark" data-i18n-title="theme.dark.title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span data-i18n="theme.dark"></span>
          </button>
        </div>
        <button id="openSettings" class="side-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span data-i18n="settings.title"></span>
        </button>
      </nav>
    </aside>
    <div id="scrim" class="scrim"></div>

    <div class="content">
      <header class="topbar">
        <button id="menu" class="menu" data-i18n-title="nav.menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="title">
          <h2 id="profileName"></h2>
          <span id="profileCount" class="count"></span>
        </div>
        <label class="search" data-i18n-title="search.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" data-i18n-placeholder="search.placeholder" spellcheck="false" />
        </label>
        <div class="controls">
          <button id="stopAll" class="btn" data-i18n-title="top.stopAll.title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            <span class="label" data-i18n="top.stopAll"></span>
          </button>
          <button id="add" class="btn primary" data-i18n-title="top.add">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span class="label" data-i18n="top.add"></span>
          </button>
        </div>
      </header>

      <main>
        <section id="empty" class="empty" hidden>
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          </div>
          <h2 data-i18n="empty.title"></h2>
          <p data-i18n-html="empty.text"></p>
          <button id="emptyAdd" class="btn primary">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="empty.choose"></span>
          </button>
          <p class="formats">mp3, wav, ogg, m4a, aac, flac, webm, opus</p>
        </section>
        <section id="list" class="table" role="table" data-i18n-aria="list.label">
          <div class="thead" role="row">
            <span role="columnheader"><input id="selectAll" type="checkbox" class="check" data-i18n-title="list.selectAll" /></span>
            <span role="columnheader"></span>
            <span role="columnheader"><button class="sort" data-sort="name" data-i18n-title="list.sortName"><span data-i18n="list.name"></span> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></span>
            <span role="columnheader"><button class="sort" data-sort="key" data-i18n-title="list.sortKey"><span data-i18n="list.key"></span> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button></span>
            <span role="columnheader" data-i18n="list.volume"></span>
            <span role="columnheader"></span>
          </div>
          <div id="grid" class="tbody" role="rowgroup"></div>
          <p id="noResults" class="no-results" hidden></p>
        </section>
      </main>
      <section id="settingsView" class="settings-view">
        <header class="topbar">
          <button class="menu" data-i18n-title="nav.menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <button id="settingsBack" class="back" data-i18n-title="settings.back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="title"><h2 data-i18n="settings.title"></h2></div>
        </header>

        <div class="settings-body">
          <h3 class="group-title" data-i18n="settings.group.audio"></h3>
          <div class="setting">
            <div class="setting-text">
              <strong data-i18n="settings.output.title"></strong>
              <p data-i18n="settings.output.desc"></p>
            </div>
            <div class="setting-control"><select id="output" class="select"></select></div>
          </div>
          <div class="setting">
            <div class="setting-text">
              <strong data-i18n="settings.master.title"></strong>
              <p data-i18n="settings.master.desc"></p>
            </div>
            <div class="setting-control">
              <label class="master" data-i18n-title="settings.master.title">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <input id="master" type="range" min="0" max="1" step="0.01" />
                <span id="masterValue" class="vol-value"></span>
              </label>
            </div>
          </div>
          <label class="setting switch">
            <div class="setting-text">
              <strong data-i18n="settings.exclusive.title"></strong>
              <p data-i18n="settings.exclusive.desc"></p>
            </div>
            <div class="setting-control">
              <input id="exclusive" type="checkbox" />
              <span class="track"><span class="thumb"></span></span>
            </div>
          </label>

          <h3 class="group-title" data-i18n="settings.group.keys"></h3>
          <div class="setting">
            <div class="setting-text">
              <strong data-i18n="settings.stop.title"></strong>
              <p data-i18n-html="settings.stop.desc"></p>
            </div>
            <div class="setting-control"><button id="stopKey" class="keycap"></button></div>
          </div>
          <div id="keyboardWrap" class="setting" hidden>
            <div class="setting-text">
              <strong data-i18n="settings.keyboard.title"></strong>
              <p data-i18n="settings.keyboard.desc"></p>
            </div>
            <div class="setting-control"><select id="keyboard" class="select"></select></div>
          </div>

          <h3 class="group-title" data-i18n="settings.group.background"></h3>
          <div class="setting">
            <div class="setting-text">
              <strong data-i18n="settings.close.title"></strong>
              <p id="closeHint"></p>
            </div>
            <div class="setting-control">
              <select id="closeToTray" class="select">
                <option value="tray" data-i18n="settings.close.tray"></option>
                <option value="quit" data-i18n="settings.close.quit"></option>
              </select>
            </div>
          </div>

          <label class="setting switch" id="loginWrap">
            <div class="setting-text">
              <strong data-i18n="settings.login.title"></strong>
              <p id="loginHint"></p>
            </div>
            <div class="setting-control">
              <input id="openAtLogin" type="checkbox" />
              <span class="track"><span class="thumb"></span></span>
            </div>
          </label>

          <h3 class="group-title" data-i18n="settings.group.backup"></h3>
          <div class="setting">
            <div class="setting-text">
              <strong data-i18n="settings.backup.title"></strong>
              <p data-i18n="settings.backup.desc"></p>
            </div>
            <div class="setting-control buttons">
              <button id="backupExport" class="btn small" data-i18n="settings.backup.export"></button>
              <button id="backupRestore" class="btn small" data-i18n="settings.backup.restore"></button>
            </div>
          </div>

          <h3 class="group-title" data-i18n="settings.group.updates"></h3>
          <div class="setting">
            <div class="setting-text">
              <strong id="updTitle">Soundboard</strong>
              <p id="updText"></p>
            </div>
            <div class="setting-control buttons">
              <button id="updAction" class="btn small primary" hidden></button>
              <button id="updCheck" class="btn small" data-i18n="settings.updates.check"></button>
            </div>
          </div>

          <h3 class="group-title" data-i18n="settings.group.appearance"></h3>
          <div class="setting">
            <div class="setting-text">
              <strong data-i18n="settings.theme.title"></strong>
              <p data-i18n="settings.theme.desc"></p>
            </div>
            <div class="setting-control">
              <div class="theme" role="group" data-i18n-aria="theme.label">
                <button data-theme="system" data-i18n-title="theme.system.title">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
                  <span data-i18n="theme.system"></span>
                </button>
                <button data-theme="light" data-i18n-title="theme.light.title">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                  <span data-i18n="theme.light"></span>
                </button>
                <button data-theme="dark" data-i18n-title="theme.dark.title">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                  <span data-i18n="theme.dark"></span>
                </button>
              </div>
            </div>
          </div>
          <div class="setting">
            <div class="setting-text">
              <strong data-i18n="settings.language.title"></strong>
              <p data-i18n="settings.language.desc"></p>
            </div>
            <div class="setting-control">
              <!-- os nomes dos idiomas ficam no próprio idioma, para quem não entende o atual achar o seu -->
              <select id="language" class="select">
                <option value="system" data-i18n="settings.language.system"></option>
                <option value="pt-BR">Português (Brasil)</option>
                <option value="en">English</option>
              </select>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div id="bulk" class="bulk" hidden>
    <span id="bulkCount" class="bulk-count"></span>
    <label class="bulk-vol" data-i18n-title="bulk.volume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <input id="bulkVol" type="range" min="0" max="1" step="0.01" />
      <span id="bulkVolValue" class="vol-value"></span>
    </label>
    <button id="bulkRemove" class="btn small danger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      <span data-i18n="bulk.remove"></span>
    </button>
    <button id="bulkClear" class="side-add" data-i18n-title="bulk.clear">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <div id="drop" class="drop" hidden>
    <div class="drop-inner">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
      </div>
      <strong data-i18n="drop.title"></strong>
      <span data-i18n="drop.text"></span>
    </div>
  </div>

  <div id="editor" class="modal" hidden>
    <form class="modal-card editor" id="editorForm" novalidate>
      <header class="editor-head">
        <h3 id="edTitle"></h3>
        <span id="edStep" class="count"></span>
        <button type="button" id="edClose" class="side-add" data-i18n-title="editor.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <label class="field">
        <span class="field-label" data-i18n="editor.name"></span>
        <input id="edName" class="text" spellcheck="false" maxlength="120" />
      </label>

      <div class="field">
        <div class="trim-head">
          <span class="field-label" data-i18n="editor.trim"></span>
          <span id="edTimes" class="times"></span>
        </div>
        <div id="edWave" class="wave">
          <canvas></canvas>
          <div class="shade left"></div>
          <div class="shade right"></div>
          <div class="handle start" data-i18n-title="editor.handleStart"></div>
          <div class="handle end" data-i18n-title="editor.handleEnd"></div>
          <div class="playhead" hidden></div>
          <p class="wave-msg"></p>
        </div>
        <div class="trim-actions">
          <button type="button" id="edPreview" class="btn small">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            <span></span>
          </button>
          <button type="button" id="edReset" class="btn small ghost" data-i18n="editor.reset"></button>
        </div>
      </div>

      <div class="field">
        <span class="field-label"><span data-i18n="editor.key"></span> <span class="required" data-i18n="editor.required"></span></span>
        <div class="key-pick">
          <button type="button" id="edKey" class="keycap"></button>
          <span id="edKeyNote" class="key-note"></span>
        </div>
      </div>

      <footer class="editor-foot">
        <button type="button" id="edSkip" class="btn ghost" data-i18n="editor.skip"></button>
        <span class="spacer"></span>
        <button type="button" id="edCancel" class="btn" data-i18n="editor.cancel"></button>
        <button type="submit" id="edSave" class="btn primary"></button>
      </footer>
    </form>
  </div>

  <div id="capture" class="modal" hidden>
    <div class="modal-card">
      <div class="keycap big pulse" id="captureKey">?</div>
      <h3 id="captureTitle"></h3>
      <p id="captureHint"></p>
    </div>
  </div>

  <div id="popover" class="popover" role="menu" hidden></div>

  <div id="toast" class="toast" hidden></div>

  <template id="tabTpl">
    <div class="tab" data-i18n-title="tab.title">
      <input class="tab-name" readonly spellcheck="false" />
      <span class="tab-count"></span>
      <button class="keycap tiny"></button>
      <button class="tab-more" data-i18n-title="tab.more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
    </div>
  </template>

  <template id="rowTpl">
    <div class="row" role="row">
      <div class="progress"><span></span></div>
      <div class="cell" role="cell"><input type="checkbox" class="check select" data-i18n-title="row.select" /></div>
      <div class="cell" role="cell">
        <button class="play" data-i18n-title="row.play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <div class="cell" role="cell"><button class="name" data-i18n-title="row.name"></button></div>
      <div class="cell key-cell" role="cell">
        <button class="keycap"></button>
        <span class="key-warn" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>
        </span>
      </div>
      <div class="cell vol-wrap" role="cell" data-i18n-title="row.volume">
        <input class="vol" type="range" min="0" max="1" step="0.01" />
        <span class="vol-value"></span>
      </div>
      <div class="cell actions" role="cell">
        <button class="icon-btn edit" data-i18n-title="row.edit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
        </button>
        <button class="icon-btn remove" data-i18n-title="row.remove">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>

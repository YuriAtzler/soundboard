<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; media-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Soundboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg>
      </div>
      <h1>Soundboard</h1>
    </div>

    <div class="controls">
      <label class="master" title="Volume geral">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <input id="master" type="range" min="0" max="1" step="0.01" />
      </label>

      <div class="stop-group">
        <button id="stopAll" class="btn ghost" title="Parar todos os sons (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          Parar
        </button>
        <button id="stopKey" class="keycap small" title="Tecla para parar todos os sons (funciona como atalho global)"></button>
      </div>
      <button id="add" class="btn primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Adicionar áudio
      </button>
    </div>

    <nav class="profilebar">
      <div id="tabs" class="tabs"></div>
      <button id="addProfile" class="tab-add" title="Novo perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <label class="switch exclusive" title="Um som novo corta o que estiver tocando">
        <input id="exclusive" type="checkbox" />
        <span class="track"><span class="thumb"></span></span>
        <span>Um som por vez</span>
      </label>
      <label id="keyboardWrap" class="output" title="Só as teclas deste teclado disparam os sons" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
        <select id="keyboard"></select>
      </label>
      <label class="output" title="Onde os sons tocam (fone, caixa ou cabo virtual)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>
        <select id="output"></select>
      </label>
    </nav>
  </header>

  <main>
    <section id="empty" class="empty" hidden>
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <h2>Nenhum som ainda</h2>
      <p>Arraste arquivos de áudio para cá ou clique em <b>Adicionar áudio</b>.<br/>
         Depois, clique em <b>Vincular tecla</b> em cada som.</p>
    </section>
    <section id="grid" class="grid"></section>
  </main>

  <div id="drop" class="drop" hidden>
    <div class="drop-inner">Solte para adicionar</div>
  </div>

  <div id="capture" class="modal" hidden>
    <div class="modal-card">
      <div class="keycap big pulse" id="captureKey">?</div>
      <h3 id="captureTitle">Pressione uma tecla</h3>
      <p id="captureHint">Pode combinar com Ctrl, Alt, Shift ou Cmd.<br/>
        <kbd>Esc</kbd> cancela · <kbd>Backspace</kbd> remove o vínculo</p>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <template id="tabTpl">
    <div class="tab" title="Clique para abrir · duplo clique no nome para renomear">
      <input class="tab-name" readonly spellcheck="false" />
      <button class="keycap tiny" title="Tecla para abrir este perfil (vale em qualquer perfil)"></button>
      <button class="tab-x" title="Apagar perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </template>

  <template id="cardTpl">
    <article class="card">
      <div class="progress"><span></span></div>
      <button class="play" title="Tocar">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button class="keycap" title="Clique para vincular uma tecla"></button>
      <input class="name" spellcheck="false" />
      <label class="vol-wrap" title="Volume deste som">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <input class="vol" type="range" min="0" max="1" step="0.01" />
      </label>
      <button class="icon-btn remove" title="Remover">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      </button>
    </article>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
